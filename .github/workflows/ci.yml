name: CI

# One rule holds this whole file together: whatever is announced as a
# requirement must break the build when it is not met. A Lighthouse score we
# "aim for" that no guard checks is not a requirement, it is an intention.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push cancels the previous one: no point paying twice.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No secret is needed: the repository is public and CI deploys nothing.
permissions:
  contents: read

env:
  NODE_VERSION: "22"
  # The tests and the budget serve the site with `wrangler dev`, the real asset
  # store. No telemetry from CI, and no interactive prompt.
  WRANGLER_SEND_METRICS: "false"

jobs:
  quality:
    name: Lint · types · design · unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # The design CSS must derive from design/tokens.json. A value written by
      # hand into the generated file, or a token changed without regeneration,
      # fails here — not three weeks later on a screen.
      - name: The design does derive from the tokens
        run: npm run tokens:check

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      # Public repository: no secret value must ever get into the history. The
      # pre-commit hook guards the workstation, this job guards what reaches the
      # branch anyway.
      - name: No secret in the tree
        run: npm run check:secrets

      # Only production dependencies are blocking: development tooling never
      # runs on a visitor's machine.
      - name: Audit of production dependencies
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: End-to-end · accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # `playwright.config.ts` builds the export and serves it with
      # `wrangler dev`, that is to say the production asset store, `_headers`
      # included: the tests see what a visitor will see, security headers and
      # all.
      - name: End-to-end tests and accessibility audit
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # Lighthouse CI is not a project dependency: it is a CI tool. Adding it to
      # package.json would bring a dozen transitive vulnerabilities into the
      # audit of a repository recruiters are going to read. The version is
      # pinned here, which is enough for reproducibility.
      # Served by `wrangler dev` per `lighthouserc.json`: we measure the layer
      # that will actually serve, not a stand-in server.
      - name: Lighthouse budget (fails below 100)
        run: npx --yes @lhci/cli@0.15.x autorun --config=lighthouserc.json

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports/
          retention-days: 7
