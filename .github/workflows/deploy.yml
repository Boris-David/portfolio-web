name: Cloudflare Workers deployment

# Wired up. Any green CI on `main` publishes the site.
#
# The configuration below is already set on the repository and only needs
# rereading to reproduce it elsewhere, or if a token rotation breaks the
# deployment.
#
# ─────────────────────────────────────────────────────────────────────────────
# WHAT TO SET ON THE portfolio-web REPOSITORY, ONCE
# ─────────────────────────────────────────────────────────────────────────────
#
# 1. Settings → Secrets and variables → Actions:
#
#      Secret    CLOUDFLARE_API_TOKEN    the API token
#      Variable  CLOUDFLARE_ACCOUNT_ID   the account id (Workers → Overview)
#
#    Nothing else. The Worker name, the assets directory and the domain are
#    declared in `wrangler.jsonc`, which is tracked.
#
# 2. The token can be THE ONE ALREADY CREATED FOR portfolio-api — same account,
#    same zone, same scopes. If one has to be created: dashboard → My Profile →
#    API Tokens → Create Token → Edit Cloudflare Workers, restricted to:
#
#      Account · Workers Scripts        : Edit
#      Account · Account Settings       : Read
#      Zone    · Workers Routes         : Edit   (zone amissan.dev)
#      Zone    · Zone                   : Read   (zone amissan.dev)
#
#    The two zone scopes serve only the custom domain; without them the
#    deployment succeeds but `amissan.dev` is not created.
#
# 3. The `amissan.dev` domain: **nothing to click**. The zone is already on the
#    account through Cloudflare Registrar, and `wrangler deploy` creates the DNS
#    record and the custom domain from `routes` in `wrangler.jsonc`.
#
# 4. `www.amissan.dev` → `amissan.dev`: ONE SINGLE THING IS LEFT TO DO BY HAND,
#    and here is why it cannot live in this repository.
#
#    A host redirect can be expressed neither in `wrangler.jsonc` nor in
#    `_headers`/`_redirects`, whose patterns match on the path and never on the
#    host name. It could be written in a Worker — but a Worker only runs on
#    requests that match NO asset, and `/` always matches. That would require
#    `run_worker_first`, that is to say a Worker on the hot path of every page
#    view: we would lose the free static assets, which are the very reason
#    Cloudflare was chosen.
#
#    The native, free form is a zone redirect rule, which runs at the edge
#    BEFORE the Workers and consumes no invocation:
#
#      a. DNS → amissan.dev → Add record → CNAME `www` to `amissan.dev`,
#         proxied (orange cloud).
#      b. Rules → Redirect Rules → Create rule:
#           If    hostname equals `www.amissan.dev`
#           Then  dynamic redirect to
#                 concat("https://amissan.dev", http.request.uri.path)
#                 status 301, preserve the query string.
#
#    Every page's canonical link already points at the apex: even without this
#    rule, no search engine would index the site twice.
#
# No private key, no service file: the token is the only secret, and it lives in
# the repository secrets — never in the repository, which is public.

on:
  # The deployment follows CI, it does not race alongside it. `workflow_run`
  # fires at the **end** of CI: nothing goes live without the tests, the
  # accessibility audit and the Lighthouse budget having passed on the exact
  # commit being published.
  #
  # The two other arrangements were ruled out:
  #
  #   `on: push` — would start **in parallel** with CI. The deployment would win
  #   the race every other time and publish a commit whose tests then fail. A
  #   guard that runs after publication guards nothing.
  #
  #   a `deploy` job in `ci.yml` with `needs:` — correct in principle, but it
  #   would bring the Cloudflare token into the workflow that runs on **every
  #   pull request**. `ci.yml` states "no secret is needed": that is a verifiable
  #   property, and it is worth more than saving one file.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

  # The content changed in `portfolio-api`. The site is a static export: it does
  # not "refresh" anything, it **rebuilds**. This is the fast path of the
  # cross-repository propagation — a few seconds after the API deploys. See
  # ADR 0007.
  #
  # ⚠️ The event type is a contract with `portfolio-api`, which sends it.
  # Renaming it here alone silently breaks the propagation.
  repository_dispatch:
    types: [contenu-mis-a-jour]

  # Callable by the freshness witness, which republishes when it finds the live
  # site was built on stale content. A reusable workflow avoids having two
  # descriptions of the deployment — and requires no token, where
  # `gh workflow run` with the `GITHUB_TOKEN` would trigger nothing: GitHub
  # refuses to let a workflow chain onto itself through that token.
  workflow_call:

  # Still triggerable by hand: republish with no new commit — token rotation,
  # asset purge, rollback.
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  WRANGLER_SEND_METRICS: "false"

jobs:
  deploy:
    name: Build, then publish the assets
    runs-on: ubuntu-latest
    # A single condition, written in the negative: **every** trigger publishes,
    # except `workflow_run`, which has to prove two things.
    #
    # `workflow_run` fires whether CI **succeeded or failed** — `on:` offers no
    # filtering on the conclusion, so it is written here.
    #
    # And `event == 'push'` is not belt and braces: `branches: [main]` filters on
    # the *source* branch. A pull request from a fork whose branch is called
    # `main` would satisfy it — and would deploy the fork's code. Only a push to
    # our `main` triggers a publication.
    #
    # Written in the negative, the guard forgets no trigger added later:
    # `repository_dispatch`, `workflow_call` and `workflow_dispatch` pass
    # without anyone having had to name them.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    steps:
      # This check used to skip the step silently when the token was missing,
      # because no token existed yet. It fails now that the deployment is
      # automatic: a deployment that "succeeds" without publishing anything
      # makes a merged fix look live. It happened on 2026-09-17 — the renaming
      # of the résumé PDF stayed invisible for three quarters of an hour behind
      # a green CI.
      - name: Check that the configuration exists
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN (secret)"
          [ -n "$ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID (variable)"
          if [ -n "$missing" ]; then
            echo "::error::Deployment not configured, missing:$missing — see the header of this workflow."
            exit 1
          fi

      # `workflow_run` runs the workflow file from the default branch, but it
      # does not position the repository for us: without `ref`, we would publish
      # the tip of `main` at deployment time, not the commit CI validated. Two
      # merges close together are enough to make them different.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install the dependencies
        run: npm ci

      # A deployment cannot go out with design CSS that has drifted from
      # `design/tokens.json`. The guard is the same as in CI, replayed here
      # because a manual deployment does not necessarily go through a pull
      # request.
      - name: The design does derive from the tokens
        run: npm run tokens:check

      - name: Build the static export
        run: npm run build

      # Consistency guard: `out/` has to carry both languages, the 404 page and
      # the headers. Publishing a truncated export would put a broken site
      # online, and `wrangler deploy` would not complain — it publishes what it
      # is handed.
      - name: Check the export before publishing
        run: |
          missing=""
          for file in out/index.html out/en.html out/404.html out/_headers out/icon.svg; do
            [ -f "$file" ] || missing="$missing $file"
          done
          if [ -n "$missing" ]; then
            echo "::error::Incomplete export, publication refused:$missing"
            exit 1
          fi
          echo "Export complete: $(find out -type f | wc -l) files."

      - name: Publish the static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

      # The deployment can succeed and the site be broken: wrong domain, missing
      # assets, lost headers. We check it from the outside.
      - name: Check the live site
        run: |
          set -euo pipefail
          for path in / /en; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 3 \
              --retry-all-errors "https://amissan.dev$path")
            [ "$code" = "200" ] || { echo "::error::$path answers $code"; exit 1; }
          done
          curl -sI https://amissan.dev/ | grep -qi '^content-security-policy' \
            || { echo "::error::security headers missing — _headers not picked up"; exit 1; }
          echo "Site live, headers served."
